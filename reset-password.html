<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<script defer src="/consent.js"></script>
<title>Reset password · Lineupr</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="admin-body">

<div class="confirm-wrap">
  <div class="home-brand confirm-brand">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
      <circle cx="20" cy="20" r="17" stroke="#ffa53e" stroke-width="2.2"/>
      <circle cx="20" cy="20" r="9"  stroke="#ffa53e" stroke-width="1" opacity="0.3"/>
      <circle cx="20" cy="20" r="3.5" fill="#ffa53e"/>
    </svg>
    <span class="home-wordmark">lineup<span class="home-wordmark-r">r</span></span>
  </div>

  <div class="confirm-card">
    <div id="resetForm" hidden>
      <h3>Set a new password</h3>
      <p class="confirm-text">Choose a new password for your account.</p>
      <div class="auth-modal">
        <label class="field-label">New password</label>
        <input type="password" id="newPasswordInput" autocomplete="new-password" placeholder="At least 8 characters">
        <label class="field-label">Repeat new password</label>
        <input type="password" id="newPasswordInput2" autocomplete="new-password" placeholder="Repeat it">
        <p class="auth-error info" id="resetError" hidden></p>
        <button class="primary-btn auth-submit-btn" id="resetSubmitBtn">Update password</button>
      </div>
    </div>
    <div id="resetOk" hidden>
      <div class="confirm-icon">✓</div>
      <h3>Password updated</h3>
      <p class="confirm-text">You're signed in with your new password.</p>
      <a href="/" class="primary-btn confirm-btn">Open Lineupr</a>
    </div>
    <div id="resetErr" hidden>
      <div class="confirm-icon confirm-icon-err">✕</div>
      <h3>Something's not right</h3>
      <p class="confirm-text" id="resetErrText"></p>
      <a href="/" class="primary-btn confirm-btn">Go to Lineupr</a>
    </div>
  </div>
</div>

<script type="module">
// Supabase redirects here from the reset-password email with recovery
// tokens in the URL hash (or an error, e.g. an expired/used link). Creating
// the client parses the hash and establishes a session for exactly this flow.
const hash = new URLSearchParams(window.location.hash.slice(1));

function showErr(msg) {
  document.getElementById("resetErr").hidden = false;
  document.getElementById("resetErrText").textContent = msg;
}

if (hash.get("error")) {
  showErr((hash.get("error_description") || "The reset link is invalid or has expired.").replace(/\+/g, " "));
} else {
  (async () => {
    try {
      const res = await fetch("/api/config");
      const cfg = await res.json();
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) { showErr("Couldn't reach the server. Try again shortly."); return; }
      const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      const { data } = await sb.auth.getSession();
      if (!data || !data.session) {
        showErr("This page only works from the link in a password-reset email.");
        return;
      }

      const formBox = document.getElementById("resetForm");
      const okBox = document.getElementById("resetOk");
      const pwInput = document.getElementById("newPasswordInput");
      const pw2Input = document.getElementById("newPasswordInput2");
      const errBox = document.getElementById("resetError");
      const submitBtn = document.getElementById("resetSubmitBtn");

      formBox.hidden = false;

      function showFieldError(msg) {
        errBox.classList.remove("info");
        errBox.textContent = msg;
        errBox.hidden = false;
      }

      async function submit() {
        const pw = pwInput.value;
        const pw2 = pw2Input.value;
        if (pw.length < 8) { showFieldError("Password must be at least 8 characters."); return; }
        if (pw !== pw2) { showFieldError("The passwords don't match."); return; }
        submitBtn.disabled = true;
        try {
          const { error } = await sb.auth.updateUser({ password: pw });
          if (error) throw error;
          formBox.hidden = true;
          okBox.hidden = false;
        } catch (e) {
          showFieldError((e && e.message) || "Couldn't update the password.");
        } finally {
          submitBtn.disabled = false;
        }
      }

      submitBtn.onclick = submit;
      [pwInput, pw2Input].forEach(el => el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
      }));
    } catch {
      showErr("Couldn't reach the server. Try again shortly.");
    }
  })();
}
</script>
</body>
</html>
