<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<script defer src="/consent.js"></script>
<title>Admin · Lineupr</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="/vendor/supabase-2.110.0.js"></script>
<script type="module" src="/analytics.js"></script>
</head>
<body class="admin-body">

<!-- Hidden until js/admin.js has confirmed the visitor is signed in as an admin;
     anyone else is sent to the main site and never sees this UI. There is no
     sign-in form here: sign in on the main site, then open this page. -->
<div class="admin-wrap" id="adminWrap" hidden>
  <!-- Left: brand, sections, account. Same shape as the map app's sidebar. -->
  <aside class="admin-sidebar">
    <a class="brand admin-brand" href="/" aria-label="Lineupr home">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
        <circle cx="20" cy="20" r="17" stroke="#ffa53e" stroke-width="2.2"/>
        <circle cx="20" cy="20" r="9"  stroke="#ffa53e" stroke-width="1" opacity="0.3"/>
        <line x1="20" y1="3"  x2="20" y2="11" stroke="#ffa53e" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="29" x2="20" y2="37" stroke="#ffa53e" stroke-width="2" stroke-linecap="round"/>
        <line x1="3"  y1="20" x2="11" y2="20" stroke="#ffa53e" stroke-width="2" stroke-linecap="round"/>
        <line x1="29" y1="20" x2="37" y2="20" stroke="#ffa53e" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3.5" fill="#ffa53e"/>
        <circle cx="20" cy="20" r="1.4" fill="#0f0c09"/>
      </svg>
      <span class="sidebar-wordmark">lineup<span class="sidebar-wordmark-r">r</span></span>
      <span class="admin-tag">Admin</span>
    </a>
    <nav class="admin-nav" id="viewToggle" aria-label="Admin sections" hidden>
      <p class="rail-label">Review</p>
        <button type="button" class="admin-nav-item active" data-view="moderation"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="m4.5 11 2.5-3 2 2 1.5-1.5 1.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span>Screenshots</span></button>
        <button type="button" class="admin-nav-item" data-view="accounts"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 13.5c.6-2.3 2.6-3.5 5-3.5s4.4 1.2 5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Accounts</span></button>
        <button type="button" class="admin-nav-item" data-view="feedback"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6A1.5 1.5 0 0 1 12.5 11H7l-3.2 2.7a.4.4 0 0 1-.65-.3V11A1.5 1.5 0 0 1 2 9.5v-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>Feedback</span></button>
      <p class="rail-label">Content</p>
        <button type="button" class="admin-nav-item" data-view="official"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3h4v10H3zM9 3h4v10H9z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>Sides</span></button>
        <button type="button" class="admin-nav-item" data-view="areas"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4.5 6 3l4 1.5L13.5 3v8.5L10 13l-4-1.5L2.5 13z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 3v8.5M10 4.5V13" stroke="currentColor" stroke-width="1.2"/></svg><span>Areas</span></button>
        <button type="button" class="admin-nav-item" data-view="collections"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4h7M2.5 8h7M2.5 12h4M12 9v5M9.5 11.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Collections</span></button>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="/" class="admin-back" id="backToSite">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to site
      </a>
      <div class="admin-account-box">
        <span class="auth-email" id="adminEmail"></span>
        <button id="adminSignOut" class="icon-btn sign-out-btn" aria-label="Sign out" title="Sign out" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10.5 11 13.5 8l-3-3M13.5 8H6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="admin-main" id="adminMain" hidden>
    <header class="admin-page-head">
      <div>
        <h1 class="admin-title" id="adminTitle">Screenshots</h1>
        <p class="admin-desc" id="adminDesc"></p>
      </div>
      <div class="admin-status-toggle side-seg" id="statusToggle" role="group" aria-label="Which lineups" hidden>
        <button class="side-seg-btn active" data-status="unreviewed">Pending</button>
        <button class="side-seg-btn" data-status="suggested">Suggested</button>
        <button class="side-seg-btn" data-status="all">All</button>
      </div>
    </header>
    <p class="admin-hint" id="adminHint">Loading…</p>
    <div class="admin-queue" id="adminQueue"></div>
    <div class="admin-accounts" id="adminAccounts" hidden></div>
    <div class="admin-tool" id="adminOfficial" hidden></div>
    <div class="admin-tool" id="adminAreas" hidden></div>
    <div class="admin-tool" id="adminCollections" hidden></div>
    <div class="admin-tool" id="adminFeedback" hidden></div>
  </main>
</div>

<!-- fullscreen image viewer -->
<div class="modal-backdrop lightbox-backdrop" id="adminLightbox">
  <button class="icon-btn lightbox-close" id="adminLightboxClose">✕</button>
  <img id="adminLightboxImg" class="lightbox-image" alt="screenshot">
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
